<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signage Admin</title>
<style>
  :root{ --bg:#111318; --card:#1a1d24; --line:#2b303b; --ink:#e8eaf0; --dim:#8b93a5;
         --accent:#4f8cff; --warn:#fbbf24; --bad:#f87171; --ok:#4ade80 }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 80px}
  h1{font-size:20px;margin:0}
  h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
     margin:28px 0 10px;font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
  label{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px}
  input,select,button{font:inherit;color:var(--ink);background:#22262f;
       border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%}
  input[type=checkbox]{width:22px;height:22px;padding:0;vertical-align:middle}
  button{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;cursor:pointer}
  button.ghost{background:#22262f;border-color:var(--line);color:var(--ink);font-weight:500}
  button.danger{background:#2a1c1e;border-color:#5b2c30;color:var(--bad);font-weight:500}
  button:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:8px;align-items:center}
  .row>*{flex:1}
  .row>.fix{flex:0 0 auto;width:auto}
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px;
       padding-bottom:14px;border-bottom:1px solid var(--line)}
  .top button{width:auto;padding:8px 14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media (max-width:560px){ .grid{grid-template-columns:1fr} }
  .thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;border-radius:6px;display:block}
  .meta{font-size:13px;color:var(--dim);word-break:break-all}
  .pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;
        border:1px solid var(--line);color:var(--dim)}
  .pill.off{color:var(--bad);border-color:#5b2c30}
  .pill.on{color:var(--ok);border-color:#255c39}
  #status{position:fixed;left:0;right:0;bottom:0;padding:12px 16px;text-align:center;
          font-size:14px;background:#22262f;border-top:1px solid var(--line);display:none}
  #status.err{background:#3a1d20;color:#ffc9cd}
  #status.ok{background:#17301f;color:#c9f5d8}
  .bar{height:8px;background:#22262f;border-radius:99px;overflow:hidden;margin-top:8px}
  .bar>i{display:block;height:100%;background:var(--accent)}
  .note{font-size:13px;color:var(--warn);margin-top:8px}
  .hint{font-size:13px;color:var(--dim);margin-top:6px}
  hr{border:0;border-top:1px solid var(--line);margin:14px 0}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== sign in ===== -->
  <div id="signin" class="card" style="margin-top:60px">
    <h1>Signage Admin</h1>
    <p class="hint">Sign in to manage TV content.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div style="height:14px"></div>
    <button id="btnIn">Sign in</button>
  </div>

  <!-- ===== app ===== -->
  <div id="app" hidden>
    <div class="top">
      <h1>Signage Admin</h1>
      <button class="ghost" id="btnOut">Sign out</button>
    </div>

    <h2>Property</h2>
    <div class="card">
      <select id="prop"></select>
      <div class="bar"><i id="useBar" style="width:0"></i></div>
      <div class="hint" id="useTxt">&nbsp;</div>
      <div class="note" id="useWarn" hidden></div>
    </div>

    <h2>Add slide</h2>
    <div class="card">
      <label for="file">Image or video file</label>
      <input id="file" type="file" accept="image/*,video/mp4">
      <div class="hint">1920&times;1080. Stills 300–500 KB. Video max 50 MB, no audio.</div>
      <div class="note" id="fileWarn" hidden></div>
      <div class="grid">
        <div>
          <label for="upZone">Category / Area</label>
          <select id="upZone"></select>
        </div>
        <div>
          <label for="upDur">Duration (seconds)</label>
          <input id="upDur" type="number" min="1" max="600" value="8">
        </div>
      </div>
      <div style="height:14px"></div>
      <button id="btnUp" disabled>Upload and publish</button>
    </div>

    <h2>Slides <span class="pill" id="count"></span></h2>
    <div id="list"></div>

    <h2>Backup</h2>
    <div class="card">
      <p class="hint" style="margin-top:0">The free tier has no backups. This file is the
        only one that exists. Export after every change.</p>
      <button class="ghost" id="btnExport">Export everything to JSON</button>
    </div>
  </div>

</div>
<div id="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Signage admin (brief v2.1 §3.3).
   Runs on Samuel's laptop or phone in a modern browser. The TV app's constraints do
   NOT apply here (§0.2) — but a framework and a build step buy nothing for one screen
   with a list and a form, so this is a single static file with no build step.
   A CDN is acceptable here and forbidden on the TV: if this fails to load the operator
   retries, whereas a TV would go blank (§0.2 failure cost). */

/* ================= CONFIG ================= */
var SUPABASE_URL  = 'https://lbtgbxexejvjqhmvpygm.supabase.co';
var SUPABASE_ANON = 'sb_publishable_KnH-IbL0AMBVtIpPw-MfLA_qbUcEPzt';
/* ========================================== */

var BUCKET      = 'signage';
var MAX_BYTES   = 50 * 1024 * 1024;        /* §2.9 hard limit, cannot be raised */
var CACHE_CTL   = '31536000';              /* §2.9 — one year, unchangeable after upload */
var QUOTA_BYTES = 1024 * 1024 * 1024;      /* free tier storage ceiling */
/* ponytail: placeholder until G3 runs with real numbers. G3 measures whether the TV's
   cache holds a property's payload overnight; until then this is a guess, not a finding.
   Set it from the G3 result and delete this comment. */
var WARN_BYTES  = 150 * 1024 * 1024;

var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
var $  = function(id){ return document.getElementById(id); };

var zones  = [];      /* [{property, slug, label, sort_order}] */
var assets = [];      /* current property's rows, in sort_order */
var objects = [];     /* current property's storage objects */
var pickedFile = null;

/* ---------- status line ---------- */
var stTimer = null;
function status(msg, kind){
  var el = $('status');
  el.textContent = msg;
  el.className = kind || '';
  el.style.display = msg ? 'block' : 'none';
  clearTimeout(stTimer);
  if (msg && kind !== 'err') stTimer = setTimeout(function(){ status(''); }, 4000);
}
function fail(where, err){
  console.error(where, err);
  status(where + ': ' + ((err && err.message) || String(err)), 'err');
}
function mb(bytes){ return (bytes / 1048576).toFixed(1) + ' MB'; }
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ---------- auth ---------- */
$('btnIn').onclick = async function(){
  var btn = this; btn.disabled = true; status('Signing in…');
  var r = await db.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pw').value });
  btn.disabled = false;
  if (r.error) return fail('Sign in failed', r.error);
  status('');
};
$('btnOut').onclick = async function(){ await db.auth.signOut(); location.reload(); };

db.auth.onAuthStateChange(function(_e, session){ session ? start() : showSignIn(); });
db.auth.getSession().then(function(r){ r.data.session ? start() : showSignIn(); });

function showSignIn(){ $('signin').hidden = false; $('app').hidden = true; }

var started = false;
async function start(){
  if (started) return;
  started = true;
  $('signin').hidden = true;
  $('app').hidden = false;

  var r = await db.from('zones').select('*').order('property').order('sort_order');
  if (r.error) return fail('Could not load categories', r.error);
  zones = r.data || [];
  if (!zones.length) return status('The zones table is empty — run db/seed-zones.sql first.', 'err');

  var props = [], seen = {};
  zones.forEach(function(z){ if (!seen[z.property]){ seen[z.property] = 1; props.push(z.property); } });
  $('prop').innerHTML = props.map(function(p){
    return '<option value="' + esc(p) + '">' + esc(p) + '</option>';
  }).join('');
  $('prop').onchange = loadProperty;
  loadProperty();
}

/* ---------- load one property ---------- */
function currentProperty(){ return $('prop').value; }

function fillZoneSelect(sel, chosen){
  var opts = ['<option value="">All categories</option>'];
  zones.filter(function(z){ return z.property === currentProperty(); })
       .forEach(function(z){
    opts.push('<option value="' + esc(z.slug) + '"' +
              (z.slug === chosen ? ' selected' : '') + '>' + esc(z.label) + '</option>');
  });
  sel.innerHTML = opts.join('');
}

async function loadProperty(){
  fillZoneSelect($('upZone'), null);
  status('Loading…');

  var a = await db.from('assets').select('*')
            .eq('property', currentProperty()).order('sort_order');
  if (a.error) return fail('Could not load slides', a.error);
  assets = a.data || [];

  var s = await db.storage.from(BUCKET).list(currentProperty(), { limit: 1000 });
  objects = s.error ? [] : (s.data || []);
  if (s.error) console.warn('storage list', s.error);

  renderUsage();
  renderList();
  status('');
}

function renderUsage(){
  var used = objects.reduce(function(n, o){
    return n + ((o.metadata && o.metadata.size) || 0);
  }, 0);
  $('useBar').style.width = Math.min(100, used / QUOTA_BYTES * 100) + '%';
  $('useTxt').textContent = objects.length + ' file(s), ' + mb(used) +
    ' in this property — free tier ceiling is 1 GB across all six.';
  var warn = $('useWarn');
  if (used > WARN_BYTES){
    warn.hidden = false;
    warn.textContent = 'This property is carrying ' + mb(used) +
      '. Large payloads are what gate G3 tests — check weekly egress in the Supabase dashboard.';
  } else warn.hidden = true;
}

/* ---------- slide list ---------- */
function toLocalInput(iso){
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d)) return '';
  var p = function(n){ return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) +
         'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function fromLocalInput(v){ return v ? new Date(v).toISOString() : null; }

function renderList(){
  $('count').textContent = assets.length + ' total';
  if (!assets.length){
    $('list').innerHTML = '<div class="card"><span class="hint">No slides yet. ' +
      'A TV pointed at this property will show its offline slide.</span></div>';
    return;
  }
  $('list').innerHTML = assets.map(function(r, i){
    var zoneLabel = 'All categories';
    zones.forEach(function(z){ if (z.property === r.property && z.slug === r.zone) zoneLabel = z.label; });
    var media = r.media_type === 'video'
      ? '<video class="thumb" src="' + esc(r.media_url) + '" muted playsinline preload="metadata"></video>'
      : '<img class="thumb" src="' + esc(r.media_url) + '" alt="">';
    return '<div class="card" data-i="' + i + '">' +
      media +
      '<div class="row" style="margin-top:10px">' +
        '<span class="pill ' + (r.is_active ? 'on' : 'off') + '">' +
          (r.is_active ? 'LIVE' : 'HIDDEN') + '</span>' +
        '<span class="pill">' + esc(r.media_type) + '</span>' +
        '<span class="pill">' + esc(zoneLabel) + '</span>' +
        '<button class="ghost fix" data-act="up"   ' + (i === 0 ? 'disabled' : '') + '>&uarr;</button>' +
        '<button class="ghost fix" data-act="down" ' + (i === assets.length-1 ? 'disabled' : '') + '>&darr;</button>' +
      '</div>' +
      '<div class="grid">' +
        '<div><label>Category / Area</label><select data-act="zone"></select></div>' +
        '<div><label>Duration (seconds)</label>' +
          '<input type="number" min="1" max="600" value="' + Number(r.duration_seconds) + '" data-act="dur"></div>' +
        '<div><label>Show from (optional)</label>' +
          '<input type="datetime-local" value="' + toLocalInput(r.starts_at) + '" data-act="starts"></div>' +
        '<div><label>Hide after (optional)</label>' +
          '<input type="datetime-local" value="' + toLocalInput(r.ends_at) + '" data-act="ends"></div>' +
      '</div>' +
      '<hr>' +
      '<div class="row">' +
        '<button class="ghost" data-act="toggle">' + (r.is_active ? 'Hide from TVs' : 'Show on TVs') + '</button>' +
        '<button class="danger" data-act="del">Delete row</button>' +
      '</div>' +
      '<div class="meta" style="margin-top:8px">' + esc(r.media_url) + '</div>' +
    '</div>';
  }).join('');

  /* zone selects need option lists built, not string-injected */
  Array.prototype.forEach.call($('list').querySelectorAll('[data-act=zone]'), function(sel){
    var i = Number(sel.closest('[data-i]').getAttribute('data-i'));
    fillZoneSelect(sel, assets[i].zone);
  });
}

/* one listener for the whole list */
$('list').addEventListener('change', function(e){
  var act = e.target.getAttribute('data-act');
  if (!act) return;
  var i = Number(e.target.closest('[data-i]').getAttribute('data-i'));
  var r = assets[i];
  if (act === 'zone')   return patch(r.id, { zone: e.target.value || null });
  if (act === 'dur')    return patch(r.id, { duration_seconds: Math.max(1, Number(e.target.value) || 8) });
  if (act === 'starts') return patch(r.id, { starts_at: fromLocalInput(e.target.value) });
  if (act === 'ends')   return patch(r.id, { ends_at:   fromLocalInput(e.target.value) });
});

$('list').addEventListener('click', function(e){
  var btn = e.target.closest('button[data-act]');
  if (!btn) return;
  var act = btn.getAttribute('data-act');
  var i = Number(btn.closest('[data-i]').getAttribute('data-i'));
  var r = assets[i];
  if (act === 'toggle') return patch(r.id, { is_active: !r.is_active });
  if (act === 'up')     return move(i, -1);
  if (act === 'down')   return move(i, 1);
  if (act === 'del')    return removeRow(r);
});

async function patch(id, fields){
  status('Saving…');
  var r = await db.from('assets').update(fields).eq('id', id);
  if (r.error) return fail('Save failed', r.error);
  status('Saved. TVs pick it up within 5 minutes.', 'ok');
  loadProperty();
}

/* Rewrites sort_order across the whole list, so it also repairs duplicates. */
async function move(i, dir){
  var j = i + dir;
  if (j < 0 || j >= assets.length) return;
  var order = assets.slice();
  var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
  status('Reordering…');
  for (var k = 0; k < order.length; k++){
    if (order[k].sort_order === k) continue;
    var r = await db.from('assets').update({ sort_order: k }).eq('id', order[k].id);
    if (r.error) return fail('Reorder failed', r.error);
  }
  status('Reordered.', 'ok');
  loadProperty();
}

/* Deletes the row only, never the file. §5.6 recovery is re-importing the JSON export,
   and that can only restore media if the file still exists — Storage has no versioning
   and no backup on the free tier. Hiding is the reversible action and is the one to
   reach for; clean stale files from the Supabase dashboard deliberately. */
async function removeRow(r){
  if (!confirm('Delete this row?\n\nThe media file STAYS in storage, so this is ' +
               'recoverable from a JSON export.\n\nTo simply take it off the TVs, ' +
               'use "Hide from TVs" instead.')) return;
  status('Deleting…');
  var d = await db.from('assets').delete().eq('id', r.id);
  if (d.error) return fail('Delete failed', d.error);
  status('Row deleted. File kept in storage.', 'ok');
  loadProperty();
}

/* ---------- upload ---------- */
$('file').onchange = function(){
  pickedFile = this.files && this.files[0];
  var warn = $('fileWarn');
  warn.hidden = true; warn.textContent = '';
  $('btnUp').disabled = true;
  if (!pickedFile) return;

  /* §3.3 required validation: size, and media_type against the allowed values */
  if (pickedFile.size > MAX_BYTES){
    warn.hidden = false;
    warn.textContent = 'This file is ' + mb(pickedFile.size) +
      '. The hard limit is 50 MB and it cannot be raised on the free tier.';
    return;
  }
  if (!kindOf(pickedFile)){
    warn.hidden = false;
    warn.textContent = 'Only images and MP4 video are allowed.';
    return;
  }
  $('btnUp').disabled = false;

  /* non-blocking advice — wrong-sized artwork is the easiest mistake to make */
  var notes = [];
  if (kindOf(pickedFile) === 'image'){
    if (pickedFile.size > 700 * 1024) notes.push('larger than the 300–500 KB guidance');
    var img = new Image(), url = URL.createObjectURL(pickedFile);
    img.onload = function(){
      if (img.naturalWidth !== 1920 || img.naturalHeight !== 1080){
        notes.push('this is ' + img.naturalWidth + '×' + img.naturalHeight +
                   ', the canvas is 1920×1080');
      }
      URL.revokeObjectURL(url);
      if (notes.length){ warn.hidden = false; warn.textContent = 'Will still upload, but: ' + notes.join('; ') + '.'; }
    };
    img.src = url;
  } else if (notes.length){
    warn.hidden = false; warn.textContent = 'Will still upload, but: ' + notes.join('; ') + '.';
  }
};

function kindOf(file){
  if (/^image\//.test(file.type)) return 'image';
  if (/^video\//.test(file.type)) return 'video';
  return null;
}

$('btnUp').onclick = async function(){
  if (!pickedFile) return;
  var btn = this; btn.disabled = true;
  var kind = kindOf(pickedFile);

  /* §2.9 path convention — never overwrite, and cacheControl set AT UPLOAD.
     The value cannot be changed on an already-uploaded file; the only remedy is
     re-uploading, so it has to be right the first time. */
  var ext  = (pickedFile.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '');
  var hash = (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, '')
                                : String(Math.random()).slice(2)).slice(0, 8);
  var path = currentProperty() + '/' + Date.now() + '-' + hash + '.' + ext;

  status('Uploading ' + mb(pickedFile.size) + '…');
  var up = await db.storage.from(BUCKET).upload(path, pickedFile, {
    cacheControl: CACHE_CTL,
    upsert: false
  });
  if (up.error){ btn.disabled = false; return fail('Upload failed', up.error); }

  /* absolute URL, deliberately (§2.6 / FP4) — lets media move hosts later with no TV change */
  var pub = db.storage.from(BUCKET).getPublicUrl(path);
  var maxOrder = assets.reduce(function(m, r){ return Math.max(m, r.sort_order); }, -1);

  var ins = await db.from('assets').insert({
    property:         currentProperty(),
    zone:             $('upZone').value || null,
    media_url:        pub.data.publicUrl,
    media_type:       kind,
    duration_seconds: Math.max(1, Number($('upDur').value) || 8),
    sort_order:       maxOrder + 1,
    is_active:        true
  });
  btn.disabled = false;
  if (ins.error) return fail('Uploaded, but saving the row failed', ins.error);

  $('file').value = ''; pickedFile = null; $('btnUp').disabled = true;
  $('fileWarn').hidden = true;
  status('Published. TVs pick it up within 5 minutes.', 'ok');
  loadProperty();
};

/* ---------- export (§2.7 — the only backup that exists) ---------- */
$('btnExport').onclick = async function(){
  var btn = this; btn.disabled = true; status('Exporting…');
  try {
    var a = await db.from('assets').select('*').order('property').order('sort_order');
    if (a.error) throw a.error;
    var z = await db.from('zones').select('*').order('property').order('sort_order');
    if (z.error) throw z.error;

    /* a table export alone does not preserve media, so list the objects too */
    var props = [], seen = {};
    (z.data || []).forEach(function(r){ if (!seen[r.property]){ seen[r.property] = 1; props.push(r.property); } });
    var storage = [];
    for (var i = 0; i < props.length; i++){
      var s = await db.storage.from(BUCKET).list(props[i], { limit: 1000 });
      storage.push({
        property: props[i],
        error: s.error ? s.error.message : null,
        objects: (s.data || []).map(function(o){
          return { name: props[i] + '/' + o.name,
                   size: (o.metadata && o.metadata.size) || null,
                   created_at: o.created_at || null };
        })
      });
    }

    var stamp = new Date().toISOString().replace(/[:.]/g, '-');
    var blob = new Blob([JSON.stringify({
      exported_at: new Date().toISOString(),
      supabase_url: SUPABASE_URL,
      assets: a.data, zones: z.data, storage: storage
    }, null, 2)], { type: 'application/json' });

    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url; link.download = 'signage-backup-' + stamp + '.json';
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
    status('Exported ' + (a.data || []).length + ' rows. Keep this file somewhere safe.', 'ok');
  } catch (err){ fail('Export failed', err); }
  btn.disabled = false;
};
</script>
</body>
</html>
