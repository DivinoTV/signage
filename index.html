<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,initial-scale=1">
<title>Signage</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0b0d}
  body{cursor:none;color:#fff;font-family:Arial,Helvetica,sans-serif;
       -webkit-user-select:none;-moz-user-select:none;user-select:none}
  ::-webkit-scrollbar{width:0;height:0;display:none}
  .layer{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;
         background-position:50% 50%;background-repeat:no-repeat;background-size:cover;
         -webkit-transform:scale(1);transform:scale(1)}
  .layer.on{opacity:1}
  #msg{position:absolute;top:50%;left:96px;right:96px;margin-top:-40px;text-align:center;
       font-size:56px;line-height:1.3;opacity:.5;display:none}
  #dbg{position:absolute;top:0;left:0;max-width:1600px;max-height:100%;overflow:hidden;
       padding:24px;background:rgba(0,0,0,.82);color:#4ade80;
       font:20px/1.45 monospace;white-space:pre-wrap;display:none}
  /* Operator control, inside the safe area. Deliberately large: it is pressed with a
     remote from across the room. This is the one element allowed a focus style — §2.4.6
     bans focus outlines for the guest-facing display, but a control navigated by remote
     is unusable without one. */
  #fs{position:absolute;right:96px;bottom:54px;display:none;
      font:600 44px/1 Arial,Helvetica,sans-serif;color:#fff;cursor:pointer;
      background:rgba(0,0,0,.72);border:3px solid rgba(255,255,255,.85);
      border-radius:14px;padding:22px 38px}
  #fs:focus{outline:none;border-color:#7fb0ff;background:rgba(16,38,78,.88)}
</style>
</head>
<body>
<div id="a" class="layer"></div>
<div id="b" class="layer"></div>
<div id="msg"></div>
<div id="dbg"></div>
<button id="fs" type="button">&#9974;&nbsp; Fullscreen</button>

<script>
/* Multi-Property TV Signage — TV app (brief v2.1 §3.2)
   ES5 + XHR only. No framework, no build step, no CDN, no library on this path.
   URL: index.html?property=<slug>&type=<zone-slug>[&debug=1]

   Realtime (M6) is in, unblocked by gate run 2: the socket held 7h11m with 2 drops
   across 14 hours on the real TV. It is layered on top of a fully working polling app,
   exactly as §2.5 requires — every failure path lands back on polling.
   Needs db/realtime.sql applied, or the server joins the channel and then silently
   refuses to send anything.

   NOT IMPLEMENTED YET, on purpose:
     - video playback -> M8. G4 passed but G1/G3 failed: this panel re-fetches the whole
       file on every loop, which cost 49.96 GB in one night. Video is waiting on external
       hosting (§2.9 path 2). Video rows are skipped and logged until then. */
(function(){
'use strict';

/* ================= CONFIG ================= */
/* Base project URL only — no trailing path. This code appends /rest/v1/... itself.
   Publishable key, not the legacy anon JWT: both work today (verified against REST and
   Auth on 2026-08-13), but Supabase is phasing the legacy JWT keys out and a key that
   stops working blanks every TV at once. Safe to be public by design (C6).
   Legacy anon JWT, if ever needed as a fallback, expires 2036-08-11. */
var CFG = {
  url:     'https://lbtgbxexejvjqhmvpygm.supabase.co',
  key:     'sb_publishable_KnH-IbL0AMBVtIpPw-MfLA_qbUcEPzt',
  version: '3'                       /* bump together with version.json, same commit */
};
/* ========================================== */

var POLL_LIVE    = 15 * 60 * 1000;   /* §2.8 — reconciliation while Realtime is subscribed */
var POLL_DOWN    = 5 * 60 * 1000;    /* §2.8 — Realtime unavailable, poll harder */
var PROBE_TTL    = 5 * 60 * 1000;    /* re-verify a media URL at most this often */
var RETRY_MS     = 60 * 1000;        /* while sitting on the fallback slide */
var RT_HEARTBEAT = 25 * 1000;        /* Phoenix closes an idle socket without these */
var RT_DEBOUNCE  = 1500;             /* a reorder rewrites many rows — coalesce the burst */
var RT_BACKOFF   = [2000, 5000, 15000, 30000, 60000];
var FETCH_MS     = 8000;             /* §3.2.1 boot timeout */
var FADE_MS      = 1000;             /* §2.4.5 */
var ZOOM         = 1.06;             /* §2.4.4 */
var MAX_FAILS    = 3;                /* §3.2.3 — drop a slide for the session */
var LOG_MAX      = 100;              /* §3.2.5 ring buffer */
var SLUG         = /^[a-z0-9-]{1,32}$/;
var FALLBACK     = 'fallback/offline.jpg';        /* shared, optional */
var FALLBACK_FMT = 'fallback/offline-%.jpg';      /* per-property, tried first */

var layers   = [document.getElementById('a'), document.getElementById('b')];
var msgEl    = document.getElementById('msg');
var dbgEl    = document.getElementById('dbg');
var front    = 0;
var idx      = -1;
var playlist = [];
var fails    = {};                   /* media_url -> consecutive failures */
var okAt     = {};                   /* media_url -> last successful probe, ms */
var log      = [];
var errors   = 0;
var lastOk   = 'never';
var timer    = null;
var booted   = false;

/* ---------- helpers ---------- */
function param(n){
  var m = new RegExp('[?&]' + n + '=([^&]*)').exec(location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g,' ')) : null;
}
function slug(v){ return (v && SLUG.test(v)) ? v : null; }
function sty(e, k, v){
  e.style[k] = v;
  e.style['Webkit' + k.charAt(0).toUpperCase() + k.slice(1)] = v;
}
function reflow(e){ return e.offsetHeight; }
function two(n){ return (n < 10 ? '0' : '') + n; }
function say(m){
  var d = new Date();
  log.push(two(d.getHours()) + ':' + two(d.getMinutes()) + ':' + two(d.getSeconds()) + '  ' + m);
  if (log.length > LOG_MAX) log.shift();
  if (dbgOn) paintDbg();
}

/* §2.7 / §3.2.6 — shape validation, not membership. A valid-shaped slug that does
   not exist simply matches no rows and falls through to NULL-zone content, which is
   the desired behaviour. This is what makes both values safe to interpolate below. */
var property = slug(param('property'));
var zone     = slug(param('type'));
var dbgOn    = param('debug') === '1';
var CACHE_KEY = 'signage:' + property + ':' + (zone || '*');

var motion = true;
try { if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) motion = false; }
catch (e) {}

/* ---------- network ---------- */
function get(url, auth, cb){                       /* cb(err, text) */
  var x = new XMLHttpRequest(), done = false;
  function finish(err, txt){ if (!done){ done = true; cb(err, txt); } }
  try { x.open('GET', url, true); } catch (e){ return finish(e, null); }
  if (auth){ x.setRequestHeader('apikey', CFG.key); x.setRequestHeader('Authorization', 'Bearer ' + CFG.key); }
  x.onreadystatechange = function(){
    if (x.readyState !== 4) return;
    if (x.status >= 200 && x.status < 300) finish(null, x.responseText);
    else finish(new Error('HTTP ' + x.status), null);
  };
  x.onerror = function(){ finish(new Error('network'), null); };
  /* old engines ignore x.timeout, so drive it from a timer instead */
  setTimeout(function(){
    if (!done){ try { x.abort(); } catch (e){} finish(new Error('timeout'), null); }
  }, FETCH_MS);
  try { x.send(); } catch (e){ finish(e, null); }
}

function playlistUrl(){
  var f = zone ? 'zone.is.null,zone.eq.' + zone : 'zone.is.null';
  return CFG.url + '/rest/v1/assets'
    + '?select=media_url,media_type,duration_seconds,starts_at,ends_at,meta'
    + '&property=eq.' + property
    + '&is_active=eq.true'
    + '&or=(' + f + ')'
    + '&order=sort_order.asc';
}

/* ---------- playlist ---------- */
/* §3.2.2 — validate before adopting. Anything unusable keeps the current playlist. */
function usable(rows){
  if (!rows || typeof rows.length !== 'number') return null;
  var now = new Date().getTime(), out = [], skippedVideo = 0, i, r, t;
  for (i = 0; i < rows.length; i++){
    r = rows[i];
    if (!r || typeof r.media_url !== 'string' || !r.media_url) continue;
    if (r.media_type !== 'image' && r.media_type !== 'video') continue;
    if (r.media_type === 'video'){ skippedVideo++; continue; }   /* M8 not built yet */
    /* schedule window. A bad or unparseable bound is ignored rather than hiding the slide.
       ponytail: trusts the TV clock; if drift is ever a real problem the fix is filtering
       server-side with a now() expression, not a clock sync on the TV. */
    if (r.starts_at){ t = new Date(r.starts_at).getTime(); if (!isNaN(t) && now < t) continue; }
    if (r.ends_at)  { t = new Date(r.ends_at).getTime();   if (!isNaN(t) && now > t) continue; }
    out.push(r);
  }
  if (skippedVideo) say('skipped ' + skippedVideo + ' video row(s) — video not implemented');
  return out.length ? out : null;
}

function fetchPlaylist(){
  if (!property) return;
  get(playlistUrl(), true, function(err, txt){
    if (err){ errors++; say('fetch failed: ' + err.message); if (!booted) useCache(); return; }
    var rows = null;
    try { rows = JSON.parse(txt); } catch (e){ errors++; say('reject: bad JSON'); if (!booted) useCache(); return; }
    var ok = usable(rows);
    if (!ok){ errors++; say('reject: no usable rows (' + (rows.length || 0) + ' returned)'); if (!booted) useCache(); return; }

    lastOk = new Date().toString().slice(4, 24);
    try { localStorage.setItem(CACHE_KEY, txt); } catch (e){ say('cache write failed'); }
    adopt(ok, 'network');
  });
}

function useCache(){
  var txt = null;
  try { txt = localStorage.getItem(CACHE_KEY); } catch (e){}
  if (!txt){ say('no cached playlist'); return fallback(); }
  var ok = null;
  try { ok = usable(JSON.parse(txt)); } catch (e){}
  if (!ok){ say('cached playlist unusable'); return fallback(); }
  adopt(ok, 'cache');
}

/* §3.2.1 — never blank because new data failed. A running loop keeps running; a
   replacement playlist takes effect from the next slide, not mid-slide. */
function adopt(rows, src){
  playlist = rows;
  fails = {};
  okAt  = {};
  if (idx >= playlist.length) idx = playlist.length - 1;
  say('playlist ' + rows.length + ' slide(s) from ' + src);
  if (!booted){ booted = true; advance(); }
}

/* ---------- rendering ---------- */
/* Loads the URL to prove it is fetchable. Already-cached bytes resolve instantly,
   which is what makes the n+1 preload below effectively free.
   MAX_FAILS counts CONSECUTIVE failures, and success resets the counter. Total-count
   would blank the screen on F11: a 30-minute outage fails every slide 3 times, and
   the whole playlist would stay dropped after the network came back.

   Success is memoised for one poll cycle. Supabase serves media as no-cache, so
   every un-memoised probe is a conditional request — cheap individually (304, zero
   body) but not free in aggregate: at 10-second slides that is 17,280 requests per TV
   per day, and across 22 TVs the 304 response headers alone came to 3.2 GB/month
   against a 5 GB cap. Verifying once per PROBE_TTL costs 0.2 GB/month instead.
   The memo is in-memory, so a cold boot still probes everything for real — which is
   the case that actually needs it (cached rows pointing at media the browser no
   longer holds). adopt() clears it whenever a new playlist lands. */
function probe(url, cb){
  if ((fails[url] || 0) >= MAX_FAILS) return cb(false);
  var now = new Date().getTime();
  if (okAt[url] && (now - okAt[url]) < PROBE_TTL) return cb(true);
  var img = new Image(), done = false;
  img.onload  = function(){ if (!done){ done = true; fails[url] = 0; okAt[url] = now; cb(true); } };
  img.onerror = function(){
    if (done) return;
    done = true;
    fails[url] = (fails[url] || 0) + 1;
    errors++;
    say('media failed (' + fails[url] + '/' + MAX_FAILS + ') ' + url);
    cb(false);
  };
  img.src = url;
}

function paint(url, animate){
  var back = layers[1 - front], fwd = layers[front];

  sty(back, 'transition', 'none');
  sty(back, 'transform', 'scale(1)');
  sty(back, 'transformOrigin', (idx % 2) ? '100% 100%' : '0% 0%');   /* alternating drift */
  back.style.backgroundImage = 'url("' + url.replace(/"/g, '%22') + '")';
  reflow(back);

  var trans = 'opacity ' + FADE_MS + 'ms linear';
  if (animate && motion) trans += ', transform ' + animate + 'ms ease-out';
  sty(back, 'transition', trans);
  if (animate && motion) sty(back, 'transform', 'scale(' + ZOOM + ')');

  back.className = 'layer on';
  fwd.className  = 'layer';
  front = 1 - front;
}

function advance(){
  if (timer){ clearTimeout(timer); timer = null; }
  if (!playlist.length) return fallback();

  var tried = 0;
  (function attempt(){
    if (++tried > playlist.length){ say('every slide unloadable'); return fallback(); }
    idx = (idx + 1) % playlist.length;
    var item = playlist[idx];
    probe(item.media_url, function(ok){
      if (!ok) return attempt();
      var ms = Math.max(1, item.duration_seconds || 8) * 1000;
      msgEl.style.display = 'none';
      paint(item.media_url, ms);
      timer = setTimeout(advance, ms);
      /* §3.2.3 — warm n+1 while n is on screen */
      var j = (idx + 1) % playlist.length;
      if (j !== idx) probe(playlist[j].media_url, function(){});
    });
  })();
}

/* §3.2.1 last resort, in three tiers: this property's own still, else the shared
   still, else dark + property name. All in-repo — they are what shows when Supabase
   is unreachable, so they cannot live in Supabase. A property with no artwork yet
   just falls through, so files can be added one at a time with no code change. */
function fallback(){
  if (timer){ clearTimeout(timer); timer = null; }
  var tries = property ? [FALLBACK_FMT.replace('%', property), FALLBACK] : [FALLBACK];

  (function attempt(i){
    if (i >= tries.length){
      layers[0].className = 'layer'; layers[1].className = 'layer';
      msgEl.innerHTML = property ? property.replace(/-/g, ' ').toUpperCase()
                                 : 'NO ?property= IN URL';
      msgEl.style.display = 'block';
      return retryLater();
    }
    probe(tries[i], function(ok){
      if (!ok) return attempt(i + 1);
      msgEl.style.display = 'none';
      paint(tries[i], 0);
      retryLater();
    });
  })(0);
}

function retryLater(){
  timer = setTimeout(function(){ booted = false; fetchPlaylist(); }, RETRY_MS);
}

/* ---------- poll + version (§2.8, §2.10) ---------- */
function checkVersion(){
  get('version.json?t=' + new Date().getTime(), false, function(err, txt){
    if (err) return;
    var v = null;
    try { v = JSON.parse(txt).version; } catch (e){ return; }
    if (v && String(v) !== String(CFG.version)){
      say('version ' + v + ' != ' + CFG.version + ' — reloading');
      location.reload();
    }
  });
}

/* §2.8 — Realtime is the fast path, this is the safety net, and it runs regardless of
   subscription state. The interval only relaxes to 15 minutes once the subscription is
   genuinely confirmed; anything less than that keeps it at 5. A socket that opens but
   never subscribes is therefore indistinguishable, in behaviour, from no socket at all. */
function pollMs(){ return rtState === 'subscribed' ? POLL_LIVE : POLL_DOWN; }

function poll(){
  setTimeout(function(){
    fetchPlaylist();
    checkVersion();
    poll();
  }, pollMs());
}

/* ---------- Realtime (M6, §2.8) ----------
   Raw WebSocket, no library. See README "Deviations" — the brief asks for a vendored
   supabase-js UMD bundle; this is ~70 lines against a 120 KB dependency, and the gate
   run held exactly this kind of socket for 7h11m on the actual TV.

   It is a pure optimisation. Every failure path here lands on polling, which already
   works, so the worst outcome is slower updates rather than stale ones. Nothing in this
   section may throw into the render loop — hence the try/catch around the whole thing. */
var rtState  = 'off';        /* off | connecting | open | subscribed | error */
var rtSock   = null;
var rtBeat   = null;
var rtTries  = 0;
var rtRef    = 0;
var rtDrops  = 0;
var rtSince  = 0;
var rtDebounce = null;
function rtSubscribed(why){
  if (rtState === 'subscribed') return;
  rtState = 'subscribed';
  say('realtime: subscribed (' + why + ') — poll relaxed to ' + (POLL_LIVE / 60000) + ' min');
}


function rtUrl(){
  return CFG.url.replace(/^http/, 'ws')
    + '/realtime/v1/websocket?apikey=' + encodeURIComponent(CFG.key) + '&vsn=1.0.0';
}

/* We never read the payload. Any change to the assets table means "refetch and revalidate",
   and fetchPlaylist already validates before adopting (§3.2.2). That makes this immune
   to payload-shape surprises, and it means an RLS-filtered event we cannot see is simply
   covered by the reconciliation poll instead. */
function rtChanged(why){
  say('realtime: ' + why);
  clearTimeout(rtDebounce);
  rtDebounce = setTimeout(fetchPlaylist, RT_DEBOUNCE);
}

function rtStop(){
  if (rtBeat){ clearInterval(rtBeat); rtBeat = null; }
  if (rtSock){
    try { rtSock.onclose = null; rtSock.close(); } catch (e){}
    rtSock = null;
  }
}

function rtReconnect(){
  rtStop();
  var wait = RT_BACKOFF[Math.min(rtTries, RT_BACKOFF.length - 1)];
  rtTries++;
  setTimeout(rtConnect, wait);
}

function rtConnect(){
  if (!window.WebSocket){ rtState = 'off'; say('realtime: no WebSocket support'); return; }
  try {
    rtState = 'connecting';
    rtSock = new WebSocket(rtUrl());
  } catch (e){
    rtState = 'error'; say('realtime: open failed'); rtReconnect(); return;
  }

  rtSock.onopen = function(){
    rtState = 'open';
    rtSince = new Date().getTime();
    rtTries = 0;
    try {
      rtSock.send(JSON.stringify({
        topic: 'realtime:signage',
        event: 'phx_join',
        payload: {
          config: { postgres_changes: [
            /* `revision` is the one that always arrives. Realtime only delivers a change
               whose NEW row the subscriber may see, and hiding a slide makes the new row
               invisible to anon — measured: showing reached the TV in 1s, hiding produced
               no event at all. db/realtime.sql explains it in full.
               `assets` is kept alongside it so that additions and un-hides still work if
               the revision migration has not been applied yet. Either signal means the
               same thing here — refetch — and the debounce coalesces the pair. */
            { event: '*', schema: 'public', table: 'revision' },
            { event: '*', schema: 'public', table: 'assets' }
          ] },
          access_token: CFG.key
        },
        ref: String(++rtRef)
      }));
    } catch (e){ rtState = 'error'; }
    rtBeat = setInterval(function(){
      try {
        rtSock.send(JSON.stringify({
          topic: 'phoenix', event: 'heartbeat', payload: {}, ref: String(++rtRef)
        }));
      } catch (e){}
    }, RT_HEARTBEAT);
  };

  rtSock.onmessage = function(m){
    var d = null;
    try { d = JSON.parse(m.data); } catch (e){ return; }
    if (!d || !d.event) return;

    /* Proof positive. A change actually arrived, so the subscription is real. */
    if (d.event === 'postgres_changes'){ rtSubscribed('change received'); rtChanged('change received'); return; }

    if (d.event === 'phx_reply'){
      var st = d.payload && d.payload.status;
      if (st === 'error'){ rtState = 'error'; say('realtime: join refused'); return; }
      if (st !== 'ok' || rtState === 'subscribed') return;

      /* `status: ok` means the CHANNEL joined. It does NOT mean postgres_changes is
         subscribed — the reply even echoes back a postgres_changes id that turns out to be
         useless. A refusal arrives afterwards as a separate `system` frame, so success can
         only be claimed once that window has closed without one.
         Getting this wrong is the §2.8 silent failure in its purest form: the app would
         relax to 15-minute polling, report "subscribed", and never receive anything. */
      rtState = 'joined';
      say('realtime: channel joined, waiting for the server to confirm');
      return;
    }

    /* Where the postgres_changes subscription is actually settled, after the join reply.
       The server states the outcome outright — "Subscribed to PostgreSQL" or a refusal —
       so there is nothing to infer.
       An earlier version promoted to 'subscribed' when no refusal arrived within 10s.
       That guess is what reported a healthy subscription while the poll had already been
       relaxed to 15 minutes; 'joined' now stays un-relaxed until the server says so. */
    if (d.event === 'system'){
      var msg = String((d.payload && d.payload.message) || '');
      if (/subscribed to postgres/i.test(msg)){ rtSubscribed('server confirmed'); return; }
      if (/unable to subscribe|error/i.test(msg) ||
          (d.payload && d.payload.status === 'error')){
        rtState = 'error';
        say('realtime: REFUSED — ' + msg.slice(0, 80));
      }
      return;
    }
  };

  rtSock.onerror  = function(){ if (rtState !== 'subscribed') rtState = 'error'; };
  rtSock.onclose  = function(){
    if (rtState === 'subscribed' || rtState === 'open') rtDrops++;
    rtState = 'connecting';
    say('realtime: socket closed, reconnecting');
    rtReconnect();
  };
}

/* ---------- diagnostics (§3.2.7) ---------- */
function paintDbg(){
  var cur = (idx >= 0 && playlist[idx]) ? playlist[idx].media_url : '-';
  dbgEl.innerHTML =
    'property   ' + property + '\n' +
    'zone       ' + (zone || '(null — shared only)') + '\n' +
    'app ver    ' + CFG.version + '\n' +
    'playlist   ' + playlist.length + ' slide(s)\n' +
    'slide      ' + (idx + 1) + '  ' + cur + '\n' +
    'last fetch ' + lastOk + '\n' +
    'realtime   ' + rtState + (rtSince ? '  held ' + Math.round((new Date().getTime() - rtSince) / 1000) + 's' : '') +
                    '  drops ' + rtDrops + '\n' +
    'poll       ' + (pollMs() / 60000) + ' min' +
                    (rtState === 'subscribed' ? '' : '  (realtime not confirmed)') + '\n' +
    'errors     ' + errors + '\n' +
    'motion     ' + (motion ? 'on' : 'reduced') + '\n' +
    'fullscreen ' + (!fsSupported() ? 'unsupported' : (fsActive() ? 'on' : 'off — press the button')) + '\n' +
    'UA         ' + navigator.userAgent + '\n\n' +
    log.join('\n');
}

/* ---------- fullscreen (operator control) ----------
   The Samsung browser keeps its own toolbar over the page, which eats the top of the
   canvas. This hands it back.

   The Fullscreen API requires a user gesture — a page cannot put itself fullscreen on
   load, in any browser. So this is a button, pressed once by whoever opens the browser
   in the morning: it becomes a fourth press after TV on, Home, Internet.

   It must not sit on screen in an occupied guest room, so it shows itself for 30 seconds
   after load — the window in which staff are actually standing there — then hides. Any
   remote keypress brings it back, so a late arrival is never locked out. Entering
   fullscreen hides it outright.

   This does not reopen §1.3's "no guest interaction": nothing a guest presses changes
   what is displayed. The keypress only reveals a control. */
var fsEl       = document.getElementById('fs');
var FS_HINT_MS = 30 * 1000;
var fsTimer    = null;

function fsSupported(){
  var d = document.documentElement;
  return !!(d.requestFullscreen || d.webkitRequestFullscreen);
}
function fsActive(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement ||
            document.webkitIsFullScreen);
}
function fsHide(){
  if (fsTimer){ clearTimeout(fsTimer); fsTimer = null; }
  fsEl.style.display = 'none';
}
function fsShow(){
  if (!fsSupported() || fsActive()) return;
  fsEl.style.display = 'block';
  try { fsEl.focus(); } catch (e){}          /* so OK/Enter works without arrow-keying to it */
  if (fsTimer) clearTimeout(fsTimer);
  fsTimer = setTimeout(fsHide, FS_HINT_MS);
}
function fsEnter(){
  var d = document.documentElement, p = null;
  try {
    p = d.requestFullscreen ? d.requestFullscreen() : d.webkitRequestFullscreen();
  } catch (e){ say('fullscreen: request threw'); return; }
  if (p && p['catch']) p['catch'](function(e){
    say('fullscreen refused: ' + ((e && e.name) || 'unknown'));
  });
}

fsEl.onclick = fsEnter;
function fsSync(){ if (fsActive()){ say('fullscreen: on'); fsHide(); } else fsShow(); }
if (document.addEventListener){
  document.addEventListener('fullscreenchange', fsSync, false);
  document.addEventListener('webkitfullscreenchange', fsSync, false);
  document.addEventListener('keydown', function(){ fsShow(); }, false);
}

/* ---------- boot ---------- */
if (dbgOn){ dbgEl.style.display = 'block'; setInterval(paintDbg, 1000); }
fsShow();
say('boot v' + CFG.version);

if (!property){
  say('no valid ?property= — nothing sensible to show');
  fallback();
} else {
  fetchPlaylist();
  poll();
  /* Realtime last, and inside a try/catch. §2.5: build the app so it works fully with
     Realtime removed, then add Realtime. Everything above this line is that app — if the
     next line throws on some panel we have not met, the screen keeps running on polling
     and only the diagnostics overlay records it (F10). */
  try { rtConnect(); } catch (e){ rtState = 'error'; say('realtime: init failed'); }
}

})();
</script>
</body>
</html>
